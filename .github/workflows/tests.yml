name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Test - Dependencies
        run: yarn test:deps

      - name: Test - TypeScript
        run: yarn test:types

      - name: Test - Lint
        run: yarn test:lint

      - name: Test - Prettier
        run: yarn test:format